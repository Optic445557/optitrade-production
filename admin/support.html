<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Support Inbox</title><link rel=stylesheet href=/admin/admin-v2.css><style>.support{display:grid;grid-template-columns:330px 1fr;height:100vh}.people{background:#0b1728;border-right:1px solid #223653;overflow:auto}.peoplehead{padding:18px;position:sticky;top:0;background:#0b1728}.person{padding:13px 18px;border-top:1px solid #1e304a;cursor:pointer}.person:hover{background:#142943}.person b,.person small{display:block}.person small{color:#8295ad}.chat{display:flex;flex-direction:column}.chathead{padding:16px 20px;border-bottom:1px solid #223653}.messages{flex:1;overflow:auto;padding:20px;display:grid;align-content:start;gap:10px}.msg{max-width:72%;padding:11px 13px;border-radius:14px;white-space:pre-wrap}.msg.user{background:#142943}.msg.support{margin-left:auto;background:#245fce}.msg small{display:block;opacity:.7;margin-top:5px}.compose{display:flex;gap:8px;padding:15px;border-top:1px solid #223653}.compose textarea{flex:1}.sendstate{text-align:right;color:#8295ad;padding:0 15px 8px}@media(max-width:800px){.support{grid-template-columns:1fr}.people{height:38vh}.chat{height:62vh}}</style></head><body><div class=support><aside class=people><div class=peoplehead><div class=brand>Opti<i>Trade</i></div><a href=/admin/dashboard.html style="color:#71a7ff">← Admin Overview</a><h2>Support</h2><input id=search class=search placeholder="Search any registered user"></div><div id=people></div></aside><main class=chat><div class=chathead><b id=who>Choose a user</b><div id=meta class=muted>Select any registered user to start or continue support.</div></div><div id=messages class=messages><div class=muted>No conversation selected.</div></div><div id=state class=sendstate></div><form id=form class=compose style="display:none"><textarea id=reply rows=2 maxlength=2000 placeholder="Reply as OptiTrade Support…"></textarea><button class=btn>Send</button></form></main></div><script>let current=new URLSearchParams(location.search).get('thread'),last='';const e=x=>String(x??'').replace(/[&<>]/g,'');async function users(){let r=await fetch('/api/admin/users-v2?q='+encodeURIComponent(search.value));if(r.status==401||r.status==403)return location='/login.html';let d=await r.json();people.innerHTML=d.map(x=>`<div class=person onclick="choose(${x.id})"><b>${e(x.name)}</b><small>${e(x.username?'@'+x.username:'')} ${e(x.email)}</small></div>`).join('')}async function choose(uid){let r=await fetch('/api/admin/support/start/'+uid,{method:'POST'}),d=await r.json();if(r.ok){current=d.threadId;history.replaceState(null,'','?thread='+current);load(true)}}async function load(force=false){if(!current)return;let r=await fetch('/api/admin/support/threads/'+current);if(!r.ok)return;let d=await r.json(),ids=d.messages.map(x=>x.id).join(',');who.textContent=d.thread.name||d.thread.username;meta.textContent=(d.thread.username?'@'+d.thread.username+' • ':'')+d.thread.email;form.style.display='flex';if(force||ids!=last){last=ids;messages.innerHTML=d.messages.map(m=>`<div class="msg ${m.sender_role=='user'?'user':'support'}">${e(m.body)}<small>${m.created_at}</small></div>`).join('');messages.scrollTop=messages.scrollHeight}}form.onsubmit=async z=>{z.preventDefault();let body=reply.value.trim();if(!body)return;reply.value='';state.textContent='Sending…';let r=await fetch('/api/admin/support/threads/'+current+'/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body})});if(r.ok){state.textContent='Sent ✓';load(true);setTimeout(()=>state.textContent='',1500)}else{state.textContent='Failed — retry';reply.value=body}};search.oninput=users;users();if(current)load(true);setInterval(()=>load(false),2000);</script><script src="/admin/admin-common.js"></script></body></html>
