plugins { id 'com.android.application' }

android {
    namespace 'online.optiprotrade.app'
    compileSdk 35

    defaultConfig {
        applicationId 'online.optiprotrade.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('OPTITRADE_KEYSTORE_PATH')
            def ksPassword = System.getenv('OPTITRADE_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('OPTITRADE_KEY_ALIAS') ?: 'optitrade'
            def keyPasswordValue = System.getenv('OPTITRADE_KEY_PASSWORD') ?: ksPassword
            if (ksPath && ksPassword) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}


// Keep all Kotlin runtime artifacts on one version.
// This prevents duplicate classes when an AndroidX dependency pulls an older
// kotlin-stdlib-jdk7/jdk8 artifact alongside a newer kotlin-stdlib.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.biometric:biometric:1.1.0'
}
