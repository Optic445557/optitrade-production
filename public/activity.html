<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Activity | OptiTrade</title><link rel="stylesheet" href="/css/pages.css"></head><body>
<header class="top"><a class="logo" href="/dashboard.html">↗ Opti<i>Trade</i></a><div class="top-right"><a class="pill" href="/profile.html" data-user-name>Account</a><button class="icon" data-logout>↪</button></div></header>
<main class="shell"><a class="back" href="/dashboard.html">← Back to dashboard</a><section class="hero"><div><div class="eyebrow">ACCOUNT & SECURITY</div><h1>Account Activity</h1><p>A history of important actions and account events recorded by OptiTrade.</p></div></section>
<section class="card"><div class="activity-head"><div><h2>Recent activity</h2><p class="muted">Up to the latest 100 events.</p></div><button class="btn" id="refresh">Refresh</button></div><div id="activityList" class="activity-list"><p class="muted">Loading activity…</p></div></section></main>
<nav class="bottom-nav"><a href="/dashboard.html"><span>⌂</span>Home</a><a href="/markets.html"><span>◫</span>Markets</a><a href="/trade.html"><span>↗</span>Trade</a><a href="/profile.html"><span>♙</span>Profile</a><a href="/support.html"><span>◉</span>Support</a></nav>
<script src="/js/pages.js"></script><script>
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadActivity(){if(!await auth())return;let r=await fetch('/api/activity');let d=await r.json();activityList.innerHTML=d.activity?.length?d.activity.map(x=>{const title=x.type==='balance_credit'?'Balance Credited':x.type==='balance_debit'?'Balance Debited':x.type==='balance_adjustment'?(String(x.summary||'').toLowerCase().includes('credit')?'Balance Credited':'Balance Debited'):x.type.replaceAll('_',' ');return `<div class="activity-row"><div class="activity-icon">•</div><div><b>${e(title)}</b><p>${e(x.summary)}</p><small>${new Date((x.created_at||'').replace(' ','T')+'Z').toLocaleString()}</small></div></div>`}).join(''):'<p class="muted">No account activity yet.</p>'}
refresh.onclick=loadActivity;loadActivity();
</script><script src="/js/account-support.js"></script><script src="/js/notifications.js"></script><script src="/js/i18n.js"></script></body></html>
